{% extends 'products/base.html' %}

{% block title %}{{ product.name }} - My Ecom{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <!-- Left Side: Image Placeholder -->
        <div class="col-md-6 mb-4">
            <div class="card border-0 shadow-sm h-100 bg-light d-flex align-items-center justify-content-center" style="min-height: 400px;">
                <h1 class="display-1 text-secondary">📦</h1>
            </div>
        </div>

        <!-- Right Side: Product Details -->
        <div class="col-md-6">
            <!-- Breadcrumb Navigation -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{% url 'product_list' %}" class="text-decoration-none">Home</a></li>
                    <li class="breadcrumb-item active" aria-current="page">{{ product.name }}</li>
                </ol>
            </nav>
            
            <h2 class="fw-bold mb-3">{{ product.name }}</h2>
            <h3 class="text-success fw-bold mb-4">Rs. {{ product.price }}</h3>
            
            <p class="text-muted fs-5 mb-5">{{ product.description }}</p>
            
            <div class="card border-0 shadow-sm bg-white p-4">
                <!-- Note: Keeping the button simple just like the homepage for now! -->
                <form action="{% url 'add_to_cart' product.id %}" method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">Add to Cart</button>
                        <a href="{% url 'product_list' %}" class="btn btn-outline-secondary btn-lg">Back to Catalog</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
