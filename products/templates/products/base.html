<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Ecom Store{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'product_list' %}">My Ecom</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3">
                        <a class="nav-link fs-5" href="{% url 'product_list' %}">Home</a>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link fs-5" href="{% url 'cart_detail' %}">🛒 Cart</a>
                    </li>
                    
                    {% if user.is_authenticated %}
                        <li class="nav-item me-4">
                            <a class="nav-link fs-5" href="{% url 'order_history' %}">My Orders</a>
                        </li>
                        <li class="nav-item">
                            <span class="nav-link text-warning fw-semibold">Hello, {{ user.username }}!</span>
                        </li>
                        <li class="nav-item ms-2">
                            <form action="{% url 'logout' %}" method="POST" class="m-0">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">Login</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
